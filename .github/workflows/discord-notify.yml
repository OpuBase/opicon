name: Discord notifications

on:
  push:
  pull_request:
    types: [opened, closed, reopened, synchronize, ready_for_review]
  create:
  delete:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post GitHub activity to Discord
        uses: actions/github-script@v7
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BOT_NAME: github.com/OpuDoc/opicon
        with:
          script: |
            const webhook = process.env.WEBHOOK;
            const botName = process.env.BOT_NAME;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const actor = context.actor;
            const event = context.eventName;
            const payload = context.payload;
            const server = 'https://github.com';

            const colors = {
              branch: 0x959595,
              push: 0x3498db,
              prOpen: 0x57f287,
              prMerge: 0x57f287,
              prClose: 0x3498db,
              delete: 0xed4245,
              issueOpen: 0xe67e22,
              issueClose: 0x3498db,
              comment: 0xe67e22,
            };

            const shortSha = (sha) => sha.slice(0, 7);
            const authorBlock = {
              name: actor,
              icon_url: `${server}/${actor}.png?size=64`,
            };

            let embed = {
              author: authorBlock,
              footer: { text: repo },
            };

            if (event === 'create') {
              const ref = payload.ref;
              const refType = payload.ref_type;
              embed.color = colors.branch;
              embed.title = `[${repo}] New ${refType} created: ${ref}`;
              embed.url = `${server}/${repo}`;
            } else if (event === 'delete') {
              const ref = payload.ref;
              const refType = payload.ref_type;
              embed.color = colors.delete;
              embed.title = `[${repo}] ${refType} deleted: ${ref}`;
              embed.url = `${server}/${repo}`;
            } else if (event === 'push') {
              const ref = context.ref.replace('refs/heads/', '').replace('refs/tags/', '');
              const isTag = context.ref.startsWith('refs/tags/');
              const commits = payload.commits ?? [];
              embed.color = colors.push;
              embed.url = `${server}/${repo}/commit/${context.sha}`;

              if (isTag) {
                embed.title = `[${repo}] Tag pushed: ${ref}`;
                embed.description = commits.length
                  ? commits.map((c) => `[\`${shortSha(c.id)}\`](${c.url}) ${c.message.split('\n')[0]} - ${c.author.username}`).join('\n')
                  : `[\`${shortSha(context.sha)}\`](${embed.url}) by **${actor}**`;
              } else if (commits.length === 0) {
                embed.title = `[${repo}:${ref}] Push by ${actor}`;
                embed.description = `[\`${shortSha(context.sha)}\`](${embed.url})`;
              } else if (commits.length === 1) {
                const c = commits[0];
                embed.title = `[${repo}:${ref}] 1 new commit`;
                embed.description = `[\`${shortSha(c.id)}\`](${c.url}) ${c.message.split('\n')[0]} - ${c.author.username}`;
              } else {
                embed.title = `[${repo}:${ref}] ${commits.length} new commits`;
                embed.description = commits
                  .map((c) => `[\`${shortSha(c.id)}\`](${c.url}) ${c.message.split('\n')[0]} - ${c.author.username}`)
                  .join('\n');
              }
            } else if (event === 'pull_request') {
              const pr = payload.pull_request;
              const action = payload.action;
              embed.url = pr.html_url;

              if (action === 'closed' && pr.merged) {
                embed.color = colors.prMerge;
                embed.title = `[${repo}] Pull request merged: #${pr.number} ${pr.title}`;
              } else if (action === 'closed') {
                embed.color = colors.prClose;
                embed.title = `[${repo}] Pull request closed: #${pr.number} ${pr.title}`;
              } else if (action === 'opened') {
                embed.color = colors.prOpen;
                embed.title = `[${repo}] Pull request opened: #${pr.number} ${pr.title}`;
              } else {
                embed.color = colors.push;
                embed.title = `[${repo}] Pull request ${action}: #${pr.number} ${pr.title}`;
              }

              if (pr.body) {
                const summary = pr.body.split('\n').slice(0, 12).join('\n');
                embed.description = summary.length > 1800 ? summary.slice(0, 1797) + '...' : summary;
              }
            } else if (event === 'issues') {
              const issue = payload.issue;
              const action = payload.action;
              embed.url = issue.html_url;

              if (action === 'opened') {
                embed.color = colors.issueOpen;
                embed.title = `[${repo}] Issue opened: #${issue.number} ${issue.title}`;
              } else if (action === 'closed') {
                embed.color = colors.issueClose;
                embed.title = `[${repo}] Issue closed: #${issue.number} ${issue.title}`;
              } else {
                embed.color = colors.issueOpen;
                embed.title = `[${repo}] Issue ${action}: #${issue.number} ${issue.title}`;
              }

              if (issue.body) {
                const body = issue.body.split('\n').slice(0, 12).join('\n');
                embed.description = body.length > 1800 ? body.slice(0, 1797) + '...' : body;
              }
            } else if (event === 'issue_comment') {
              const issue = payload.issue;
              const comment = payload.comment;
              embed.color = colors.comment;
              embed.url = comment.html_url;
              embed.title = `[${repo}] New comment on issue #${issue.number}: ${issue.title}`;
              const body = comment.body.split('\n').slice(0, 12).join('\n');
              embed.description = body.length > 1800 ? body.slice(0, 1797) + '...' : body;
            } else {
              embed.color = colors.push;
              embed.title = `[${repo}] ${event} by ${actor}`;
              embed.url = `${server}/${repo}`;
            }

            const body = {
              username: botName,
              avatar_url: 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png',
              embeds: [embed],
            };

            const res = await fetch(webhook + '?wait=true', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });

            if (!res.ok) {
              const text = await res.text();
              core.setFailed(`Discord webhook failed (${res.status}): ${text}`);
            }
